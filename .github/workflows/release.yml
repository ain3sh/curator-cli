name: Build and Release SEA Binaries

on:
  push:
    tags:
      - 'v*'  # Build and release on pushed tags
  release:
    types: [created, published]  # Build and release when a GitHub Release is created/published via UI
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to build and upload for (e.g., v0.1.1)'
        required: true
        type: string
      use_current_code:
        description: 'Build from current HEAD instead of tag (for re-releasing after fixes)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x64
            runner: ubuntu-latest
          - os: darwin
            arch: x64
            runner: macos-13  # Intel Mac
          - os: darwin
            arch: arm64
            runner: macos-latest  # Apple Silicon
          - os: win32
            arch: x64
            runner: windows-latest
    env:
      # Determine the tag we are building for:
      # - release event: github.event.release.tag_name
      # - push on tag: github.ref_name
      # - manual: github.event.inputs.tag
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.event.inputs.tag }}
    steps:
      - name: Checkout code at tag (or current SHA)
        uses: actions/checkout@v4
        with:
          # Prefer the resolved tag; fall back to the triggering SHA
          # If use_current_code is true, always use current HEAD
          ref: ${{ github.event.inputs.use_current_code == 'true' && github.sha || env.TAG_NAME || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build SEA binary
        run: node scripts/build-sea.cjs --current-only

      - name: Verify binary (Linux/macOS)
        if: matrix.os != 'win32'
        run: |
          chmod +x dist/binaries/curate-${{ matrix.os }}-${{ matrix.arch }}
          ls -lh dist/binaries/curate-${{ matrix.os }}-${{ matrix.arch }}
          file dist/binaries/curate-${{ matrix.os }}-${{ matrix.arch }} || true
          echo "✅ Binary created successfully"

      - name: Verify binary (Windows)
        if: matrix.os == 'win32'
        run: |
          Get-Item dist/binaries/curate-${{ matrix.os }}-${{ matrix.arch }}.exe
          Write-Output "✅ Binary created successfully"
        shell: pwsh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: curate-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/binaries/*
          retention-days: 5

  release:
    name: Create/Update GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Run for any of these:
    # - Tag push
    # - Release UI events
    # - Manual runs (with 'tag' input)
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'release') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.tag != '')
    env:
      TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || github.event.inputs.tag }}
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: binaries

      - name: Display structure
        run: ls -R binaries

      - name: Prepare release files
        run: |
          mkdir -p release
          find binaries -type f -exec mv {} release/ \;
          ls -lh release/

      - name: Create or update GitHub Release and upload assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.TAG_NAME }}
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🎨 Curator ${{ env.TAG_NAME }}

            Blazing fast CLI to curate web content as clean markdown.

            Single executable binaries for all platforms (no Node.js required!)

            ### Installation

            **One-line install (Linux/macOS/WSL):**
            ```bash
            curl -fsSL https://www.ain3sh.com/curator/install.sh | bash
            ```

            **Manual download:**
            - **Linux x64**: `curate-linux-x64`
            - **macOS Intel**: `curate-darwin-x64`
            - **macOS Apple Silicon**: `curate-darwin-arm64`
            - **Windows**: `curate-win32-x64.exe`

            ### For Contributors
            ```bash
            npm install -g curator-cli
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
